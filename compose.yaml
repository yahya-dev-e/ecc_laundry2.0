# Local integration stack. Use a TLS proxy and private secrets for production.
x-app: &app
  image: ecc-laundry:local
  build:
    context: .
    dockerfile: .docker/8.3/Dockerfile
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_DATABASE: ecc_laundry
    DB_USERNAME: laundry
    DB_PASSWORD: ${DB_PASSWORD:?Set a private DB_PASSWORD in .env}
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    SESSION_DRIVER: database
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  volumes:
    - app-storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
services:
  app:
    <<: *app
    ports: ["127.0.0.1:${APP_PORT:-8000}:80"]
  worker:
    <<: *app
    user: www-data
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=60", "--max-time=3600"]
    restart: unless-stopped
  scheduler:
    <<: *app
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ecc_laundry
      MYSQL_USER: laundry
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set a different private DB_ROOT_PASSWORD}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
volumes:
  app-storage:
  mysql-data:
